<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTix • Book your show</title>
    <!-- Google Font & Font Awesome for icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #eef2ff;
        }

        /* main card */
        .booking-app {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 24, 38, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2rem 2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        /* header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
        }

        .logo i {
            color: #f5b042;
            background: rgba(245, 176, 66, 0.15);
            padding: 10px;
            border-radius: 16px;
            font-size: 1.6rem;
            box-shadow: 0 8px 20px -6px rgba(245, 176, 66, 0.3);
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 500;
            font-size: 0.95rem;
            color: #cbd5e1;
            transition: all 0.2s;
            cursor: default;
        }

        .location-badge i {
            color: #f5b042;
        }

        /* search bar */
        .search-section {
            margin-bottom: 2rem;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .search-wrapper:focus-within {
            border-color: #f5b042;
            box-shadow: 0 0 0 3px rgba(245, 176, 66, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-wrapper i {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            font-weight: 400;
            color: white;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .search-wrapper input::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .search-wrapper button {
            background: #f5b042;
            border: none;
            color: #0b0f1c;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 20px -6px rgba(245, 176, 66, 0.4);
            font-family: 'Inter', sans-serif;
        }

        .search-wrapper button:hover {
            background: #ffc55a;
            transform: scale(1.02);
            box-shadow: 0 12px 24px -8px #f5b042;
        }

        .search-wrapper button i {
            color: #0b0f1c;
            font-size: 0.9rem;
        }

        /* section title */
        .section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            margin-top: 0.5rem;
        }

        .section-title h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title a {
            color: #f5b042;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .section-title a:hover {
            gap: 8px;
            color: #ffca6b;
        }

        /* movie grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.8rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .movie-card:hover {
            transform: translateY(-8px);
            border-color: rgba(245, 176, 66, 0.3);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(245, 176, 66, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: linear-gradient(135deg, #1e2639, #131a28);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .movie-poster i {
            font-size: 3.5rem;
            color: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
        }

        .movie-card:hover .movie-poster i {
            color: rgba(245, 176, 66, 0.3);
            transform: scale(1.05);
        }

        .movie-poster .rating-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.3rem 0.7rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #f5b042;
            border: 1px solid rgba(245, 176, 66, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .movie-info {
            padding: 1rem 1rem 1.2rem;
        }

        .movie-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.35rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .movie-meta .genre {
            background: rgba(255, 255, 255, 0.06);
            padding: 0.25rem 0.7rem;
            border-radius: 30px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #cbd5e1;
        }

        /* showtime / booking area */
        .booking-panel {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
        }

        .date-selector {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .date-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #b9c3d4;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-pill i {
            color: #f5b042;
            font-size: 0.9rem;
        }

        .date-pill.active {
            background: #f5b042;
            color: #0b0f1c;
            border-color: #f5b042;
            font-weight: 600;
            box-shadow: 0 8px 18px -8px #f5b042;
        }

        .date-pill.active i {
            color: #0b0f1c;
        }

        .date-pill:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(245, 176, 66, 0.4);
        }

        .showtimes {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .time-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }

        .time-btn i {
            color: #94a3b8;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .time-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(245, 176, 66, 0.5);
            transform: scale(1.02);
        }

        .time-btn.selected {
            background: #f5b042;
            border-color: #f5b042;
            color: #0b0f1c;
            font-weight: 700;
            box-shadow: 0 10px 20px -8px #f5b042;
        }

        .time-btn.selected i {
            color: #0b0f1c;
        }

        /* seat & action row */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-top: 0.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .seats-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .seat-count {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.5rem 1rem 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .seat-count span {
            font-weight: 500;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .seat-count .count-value {
            font-weight: 700;
            color: #f5b042;
            font-size: 1.2rem;
            min-width: 30px;
            text-align: center;
        }

        .seat-count button {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        .seat-count button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f5b042;
        }

        .price-total {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 176, 66, 0.1);
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(245, 176, 66, 0.25);
        }

        .price-total i {
            color: #f5b042;
            font-size: 1.1rem;
        }

        .price-total .amount {
            font-weight: 700;
            font-size: 1.4rem;
            color: white;
            letter-spacing: -0.5px;
        }

        .price-total .currency {
            font-weight: 500;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .book-btn {
            background: #f5b042;
            border: none;
            color: #0b0f1c;
            font-weight: 700;
            padding: 1rem 2.5rem;
            border-radius: 60px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 12px 30px -10px #f5b042;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Inter', sans-serif;
        }

        .book-btn i {
            font-size: 1rem;
            transition: 0.2s;
        }

        .book-btn:hover {
            background: #ffc55a;
            transform: scale(1.02);
            box-shadow: 0 18px 35px -8px #f5b042;
        }

        .book-btn:hover i {
            transform: translateX(4px);
        }

        /* responsive */
        @media (max-width: 700px) {
            .booking-app {
                padding: 1.5rem;
            }

            .app-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-wrapper {
                flex-wrap: wrap;
                padding: 0.8rem;
                border-radius: 30px;
            }

            .search-wrapper input {
                width: 100%;
                padding: 0.8rem 0.5rem;
            }

            .search-wrapper button {
                width: 100%;
                justify-content: center;
                margin-top: 0.3rem;
            }

            .action-row {
                flex-direction: column;
                align-items: stretch;
            }

            .book-btn {
                justify-content: center;
            }

            .seats-info {
                justify-content: space-between;
            }
        }

        @media (max-width: 480px) {
            .movie-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .date-pill {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }

            .time-btn {
                padding: 0.7rem 1.2rem;
                font-size: 0.85rem;
            }
        }

        /* tiny animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .movie-card, .booking-panel {
            animation: fadeIn 0.5s ease backwards;
        }

        .movie-card:nth-child(2) { animation-delay: 0.05s; }
        .movie-card:nth-child(3) { animation-delay: 0.1s; }
        .movie-card:nth-child(4) { animation-delay: 0.15s; }
    </style>
</head>
<body>
    <div class="booking-app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-film"></i>
                <span>MovieTix</span>
            </div>
            <div class="location-badge">
                <i class="fas fa-map-pin"></i>
                <span>Downtown • IMAX 4K</span>
            </div>
        </header>

        <!-- Search -->
        <div class="search-section">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search movies, genres, or theaters...">
                <button>
                    <i class="fas fa-sliders-h"></i> Filters
                </button>
            </div>
        </div>

        <!-- Now showing -->
        <div class="section-title">
            <h2>Now showing</h2>
            <a href="#">View all <i class="fas fa-arrow-right"></i></a>
        </div>

        <!-- Movie grid -->
        <div class="movie-grid">
            <!-- Movie 1 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <i class="fas fa-video"></i>
                    <div class="rating-badge"><i class="fas fa-star"></i> 8.7</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Dune: Part Two</div>
                    <div class="movie-meta">
                        <span class="genre">Sci-Fi</span>
                        <span>2h 46m</span>
                    </div>
                </div>
            </div>
            <!-- Movie 2 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <i class="fas fa-mask"></i>
                    <div class="rating-badge"><i class="fas fa-star"></i> 9.1</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Oppenheimer</div>
                    <div class="movie-meta">
                        <span class="genre">Drama</span>
                        <span>3h 0m</span>
                    </div>
                </div>
            </div>
            <!-- Movie 3 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <i class="fas fa-dragon"></i>
                    <div class="rating-badge"><i class="fas fa-star"></i> 8.2</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Godzilla x Kong</div>
                    <div class="movie-meta">
                        <span class="genre">Action</span>
                        <span>1h 55m</span>
                    </div>
                </div>
            </div>
            <!-- Movie 4 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <i class="fas fa-ghost"></i>
                    <div class="rating-badge"><i class="fas fa-star"></i> 7.9</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Ghostbusters</div>
                    <div class="movie-meta">
                        <span class="genre">Comedy</span>
                        <span>1h 45m</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Booking panel -->
        <div class="booking-panel">
            <!-- Date selector -->
            <div class="date-selector">
                <div class="date-pill active">
                    <i class="fas fa-calendar-alt"></i> Today, 12 Oct
                </div>
                <div class="date-pill">
                    <i class="fas fa-calendar-alt"></i> Fri, 13 Oct
                </div>
                <div class="date-pill">
                    <i class="fas fa-calendar-alt"></i> Sat, 14 Oct
                </div>
                <div class="date-pill">
                    <i class="fas fa-calendar-alt"></i> Sun, 15 Oct
                </div>
            </div>

            <!-- Showtimes -->
            <div class="showtimes">
                <div class="time-btn selected">
                    <i class="far fa-clock"></i> 14:30
                </div>
                <div class="time-btn">
                    <i class="far fa-clock"></i> 17:15
                </div>
                <div class="time-btn">
                    <i class="far fa-clock"></i> 20:00
                </div>
                <div class="time-btn">
                    <i class="far fa-clock"></i> 22:45
                </div>
            </div>

            <!-- Seat & action -->
            <div class="action-row">
                <div class="seats-info">
                    <div class="seat-count">
                        <button><i class="fas fa-minus"></i></button>
                        <span>Seats</span>
                        <span class="count-value">2</span>
                        <button><i class="fas fa-plus"></i></button>
                    </div>
                    <div class="price-total">
                        <i class="fas fa-tag"></i>
                        <span class="amount">$24.00</span>
                        <span class="currency">USD</span>
                    </div>
                </div>
                <button class="book-btn">
                    Book tickets <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- tiny interactive script (just for demonstration) -->
    <script>
        (function() {
            // date pill active switching
            const datePills = document.querySelectorAll('.date-pill');
            datePills.forEach(pill => {
                pill.addEventListener('click', function() {
                    datePills.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // showtime selection
            const timeBtns = document.querySelectorAll('.time-btn');
            timeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    timeBtns.forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                });
            });

            // simple seat count +/- demo
            const minusBtn = document.querySelector('.seat-count button:first-of-type');
            const plusBtn = document.querySelector('.seat-count button:last-of-type');
            const countSpan = document.querySelector('.count-value');
            const priceAmount = document.querySelector('.price-total .amount');
            let seats = 2;
            const pricePerSeat = 12.00;

            function updatePrice() {
                const total = (seats * pricePerSeat).toFixed(2);
                priceAmount.textContent = `$${total}`;
                countSpan.textContent = seats;
            }

            minusBtn.addEventListener('click', function() {
                if (seats > 1) {
                    seats--;
                    updatePrice();
                }
            });

            plusBtn.addEventListener('click', function() {
                if (seats < 10) {
                    seats++;
                    updatePrice();
                }
            });

            // initial price update
            updatePrice();
        })();
    </script>
</body>
</html>
